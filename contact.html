<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <link rel="icon" href="assets/c-.png" />
    <link rel="stylesheet" href="style.css" />
    <title data-i18n="contact.pageTitle">Contact - Imanska</title>
  </head>
  <body>
    <!-- Header with Navigation -->
    <header data-aos="fade-down" data-aos-delay="200">
      <div class="container">
        <div class="content">
          <div class="logo">
              <img src="assets/dark/c--.png" alt="logo" />
            <a href="index.html">IMANSKA</a>
          </div>

          <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-nav">
            <span></span><span></span><span></span>
          </button>
          <nav id="primary-nav">
            <a href="index.html#about" data-i18n="nav.about">About</a>
            <a href="projects.html" data-i18n="nav.projects">Projects</a>
            <a href="hidden-me.html" data-i18n="nav.hidden">Hidden Me</a>
            <a href="contact.html" data-i18n="nav.contact">Contact</a>
            <a href="assets/cv.pdf" download="Imane_CV.pdf" class="nav-cv" data-i18n="nav.cv">Download CV</a>
          </nav>

          <div class="extra-nav">
            <a href="contact.html"><span data-i18n="header.available">AVAILABLE FOR WORK</span></a>
            <a href="assets/cv.pdf" download="Imane_CV.pdf" class="cv-link" aria-label="Download my CV" data-i18n-attr="aria-label:header.cvAria"><span>CV</span></a>
          </div>
            <button type="button" class="lang-toggle" onclick="toggleLanguage()" aria-label="Passer en français" title="Passer en français">
              <svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>
            </button>
            <div class="theme-toggle" title="Toggle theme" onclick="toggleTheme()">
              <box-icon id="theme-icon" name="moon" type="solid" color="#fff" size="md"></box-icon>
            </div>
        </div>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="contact" id="contact-form">
      <div class="container">
        <div class="content">
          <div class="title" data-aos="fade-down" data-aos-delay="300">
            <h2 data-i18n="contact.lets">LET'S</h2>
            <h1 data-i18n="contact.connect">CONNECT</h1>
          </div>

          <div class="contact-area">
            <div data-aos="fade-right" data-aos-delay="300" class="left-side">
              <h1 data-i18n="contact.line1">SEND ME BUGS</h1>
              <h1 data-i18n="contact.line2">(OR LOVE </h1>
              <h1 data-i18n="contact.line3">        NOTES)</h1>
            </div>

            <div class="right-side">
              <p class="form-sent" role="status" hidden data-i18n="contact.sent">Thanks! Your message has been sent. I'll get back to you soon.</p>
              <form action="https://formsubmit.co/chakrellaah@gmail.com" method="POST" data-aos="fade-left" data-aos-delay="500">
                <input type="text" name="name" placeholder="YOUR NAME" data-i18n-attr="placeholder:contact.name" required>
                <input type="email" name="email" placeholder="YOUR EMAIL ADDRESS" data-i18n-attr="placeholder:contact.email" required>
                <textarea name="message" placeholder="HOW CAN I HELP YOU?" data-i18n-attr="placeholder:contact.message" required></textarea>
                <input type="hidden" name="_next" value="https://chakrellah44.github.io/portfolio/contact.html?sent=1">
                <input type="hidden" name="_subject" value="New Portfolio Contact!">
                <button type="submit" data-i18n="contact.send">SEND</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Social Media Section -->
    <section class="social-media">
      <div class="container">
        <div class="content" data-aos="fade-up" data-aos-delay="300">
          <h2 data-i18n="contact.findMe">FIND ME ON</h2>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/chakrellah" target="_blank" rel="noopener noreferrer" class="social-link">
              <box-icon name='linkedin-square' type='logo' size="lg"></box-icon>
              <span>LinkedIn</span>
            </a>
            <a href="https://github.com/CHAKRELLAH44" target="_blank" rel="noopener noreferrer" class="social-link">
              <box-icon name='github' type='logo' size="lg"></box-icon>
              <span>GitHub</span>
            </a>
            <a href="https://discord.com/app" data-discord="imane.chakre" target="_blank" rel="noopener noreferrer" class="social-link">
              <box-icon name='discord' type='logo' size="lg"></box-icon>
              <span>Discord</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Back to Home Button -->
    <div class="back-to-home" data-aos="fade-up">
      <a href="index.html" class="home-button">
        <box-icon name='home'></box-icon>
        <span data-i18n="common.backHome">BACK TO HOME</span>
      </a>
    </div>

    <footer>
      <div class="container">
        <div class="content"> 
          <h1 data-i18n="footer.title">Imanska's PORTFOLIO</h1>
            <div class="social">
          <a href="https://www.linkedin.com/in/chakrellah" target="_blank" rel="noopener noreferrer" class="logo" title="LinkedIn">
              <box-icon name='linkedin-square' type='logo'></box-icon>
            </a>
          <a href="https://discord.com/app" data-discord="imane.chakre" target="_blank" rel="noopener noreferrer" class="logo" title="Discord: imane.chakre">
              <box-icon name='discord' type='logo'></box-icon>
            </a>
          <a href="https://github.com/CHAKRELLAH44" target="_blank" rel="noopener noreferrer" class="logo" title="GitHub">
              <box-icon name='github' type='logo'></box-icon>
            </a>
            <a href="https://x.com/iman_chakre" target="_blank" rel="noopener noreferrer" class="logo" title="X (Twitter)">
              <box-icon name='twitter' type='logo'></box-icon>
            </a>
          </div>
          <p>&copy; Imanska <span id="year"></span> | <span data-i18n="footer.tagline">Building Tech, Adding Fun</span></p>
        </div>
      </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="script.js"></script>

    <!-- Box Icon -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
