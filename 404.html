<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- GitHub Pages serves this file at any broken URL: resolve links from the site root. -->
    <base href="/portfolio/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,500;0,700;1,700;1,800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/favicon-64.png" />
    <link rel="stylesheet" href="style.css" />
    <title data-i18n="notFound.pageTitle">Page not found - Imanska</title>
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: "IBM Plex Sans", sans-serif; }
      .nf { display: grid; justify-items: center; gap: 1.25rem; max-width: 40rem; text-align: center; }
      .nf-code {
        margin: 0; color: transparent; font: 700 clamp(6rem, 28vw, 12rem)/0.9 "IBM Plex Sans", sans-serif;
        -webkit-text-stroke: 2px var(--white); letter-spacing: 0.04em; animation: nf-flicker 4s infinite;
      }
      @keyframes nf-flicker { 0%, 92%, 100% { opacity: 1; } 94% { opacity: 0.4; } 96% { opacity: 1; } 97% { opacity: 0.6; } }
      .nf h1 { margin: 0; color: var(--white); font: italic 800 clamp(1.5rem, 5vw, 2.4rem) "IBM Plex Sans", sans-serif; }
      .nf-term {
        width: 100%; margin: 0; padding: 0.9rem 1.1rem; border: 1px solid rgba(var(--accent-rgb), 0.35); border-radius: 12px;
        background: rgba(0, 0, 0, 0.35); color: var(--gray); font: 500 0.9rem/1.6 "IBM Plex Mono", ui-monospace, monospace; text-align: left;
        overflow-wrap: anywhere;
      }
      .nf-term b { color: var(--primary); font-weight: 600; }
      .nf-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
      .nf-links a {
        padding: 0.7rem 1.3rem; border: 2px solid var(--primary); border-radius: 999px; color: var(--primary);
        font-weight: 700; transition: background-color 0.2s ease, color 0.2s ease;
      }
      .nf-links a:first-child, .nf-links a:hover, .nf-links a:focus-visible { background: var(--primary); color: var(--black); }
      @media (prefers-reduced-motion: reduce) { .nf-code { animation: none; } }
    </style>
  </head>
  <body>
    <main class="nf">
      <p class="nf-code" aria-hidden="true">404</p>
      <h1 data-i18n="notFound.title">This page went on a coffee break ☕</h1>
      <pre class="nf-term"><b>&gt;</b> GET <span id="nf-path">/</span>
<b>&lt;</b> 404 Not Found
<b>&gt;</b> <span data-i18n="notFound.hint">Suggestion: try one of these routes instead.</span></pre>
      <nav class="nf-links" aria-label="Pages">
        <a href="index.html" data-i18n="notFound.home">Back home</a>
        <a href="projects.html" data-i18n="nav.projects">Projects</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>
    </main>
    <script>
      window.PORTFOLIO_PAGE = "404";
      document.getElementById("nf-path").textContent = location.pathname;
      try { if (localStorage.getItem("portfolio-theme") === "light") document.body.dataset.theme = "light"; } catch (err) {}
    </script>
    <script src="i18n.js"></script>
    <script src="supabase-config.js"></script>
    <script src="analytics.js" defer></script>
  </body>
</html>
