<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050607" />
    <!-- GitHub Pages serves this file at any broken URL: resolve links from the site root.
         That root is /portfolio/ on github.io and / on a custom domain. -->
    <script>
      document.write('<base href="' + (/github\.io$/.test(location.hostname) || location.pathname.indexOf("/portfolio/") === 0 ? "/portfolio/" : "/") + '">');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/brand/favicon-64.png" />
    <title>404 · route not found - Imanska</title>
    <link rel="stylesheet" href="css/404.css" />
  </head>
  <body>
    <canvas id="rain" aria-hidden="true"></canvas>
    <main>
      <h1 class="sr-only">404 · page not found</h1>
      <section class="window" aria-label="Terminal">
        <div class="bar" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="bar-title">imanska@portfolio: ~ — zsh — 404</span>
        </div>
        <div class="screen" id="screen" role="log" aria-live="polite">
          <div id="out"></div>
          <div class="prompt-row" id="prompt" hidden>
            <span class="ps1">visitor@imanska<span class="dim">:</span><span class="path">~</span><span class="dim">$</span></span>
            <label class="input-wrap">
              <span class="ghost" id="ghost" aria-hidden="true"></span>
              <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command">
              <span class="caret" id="caret" aria-hidden="true"></span>
            </label>
          </div>
        </div>
      </section>
      <nav class="chips" aria-label="Quick commands" id="chips"></nav>
    </main>

    <script>
      window.PORTFOLIO_PAGE = "404";
    </script>
    <script src="js/i18n.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/analytics.js" defer></script>
    <script src="js/404.js"></script>
  </body>
</html>
